name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  CACHE_DEPENDENCY_PATH: '.'

jobs:
  # ─── CI: Lint, Type-Check, Build ───────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.CACHE_DEPENDENCY_PATH }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          # Minimal env vars for build validation
          # Actual production values are set in deployment platform
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/news-website-test
          AUTH_URL: http://localhost:3000

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  # ─── CD: Deploy to Vercel (main branch only) ───────────────────────────────
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.vercel-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          working-directory: .
          alias-domains: # Only for production deployments
            ${{ secrets.VERCEL_ALIAS_DOMAINS }}
          scope: ${{ secrets.VERCEL_TEAM_ID }}

  # ─── CD: Deploy Preview Apps (PRs only) ────────────────────────────────────
  preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          working-directory: .
          scope: ${{ secrets.VERCEL_TEAM_ID }}
          alias-domains:
            preview-${{ github.event.pull_request.number }}
